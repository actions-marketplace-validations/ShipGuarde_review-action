name: 'ShipGuarde Review'
description: 'Run a ShipGuarde review on a pull request and gate the job on the verdict.'
author: 'ShipGuarde'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  api-key:
    description: 'ShipGuarde API key (sg_pat_…). Store it as a repo secret.'
    required: true
  project-id:
    description: 'ShipGuarde project id to run against.'
    required: true
  api-url:
    description: 'ShipGuarde API base URL.'
    required: false
    default: 'https://api.shipguarde.com'
  target-url:
    description: 'Deployment / preview URL to drive browser checks against (optional).'
    required: false
    default: ''
  flow:
    description: >-
      A plain-English journey for the vision agent to drive on target-url, e.g.
      "Click the Status filter, choose Failed, confirm only Failed rows remain".
      Optional; saved project tests with an on-PR policy run regardless.
    required: false
    default: ''
  github-token:
    description: >-
      GitHub token used to clone the repo and post the verdict when no ShipGuarde
      App is installed. Defaults to the workflow token; grant it contents: read,
      pull-requests: write and checks: write in the job's permissions block.
    required: false
    default: ${{ github.token }}
  agents:
    description: 'Comma-separated agent kinds to run (optional; defaults to the project policy).'
    required: false
    default: ''
  fail-on:
    description: 'When to fail the job: "block", "block_or_warn", or "never".'
    required: false
    default: 'block'
  timeout-seconds:
    description: 'Maximum seconds to wait for the verdict.'
    required: false
    default: '900'
outputs:
  run-id:
    description: 'The ShipGuarde run id.'
  verdict:
    description: 'The verdict decision (ship | ship_with_warnings | block | inconclusive).'
runs:
  using: 'node24'
  main: 'index.mjs'
